<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Sayali And Raj Wedding Invitation</title>
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./petal.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />
  </head>
  <body>
    <div class="sakura-falling"></div>
    <section>
      <img src="./images/center.png" class="top-left-decoration" />
      <img src="./images/center.png" class="top-right-decoration" />
      <img src="./images/center.png" class="center-bottom-decoration" />
      <img
        src="./images/latern.png"
        class="latern-first-decoration pendulum-slow"
      />
      <img
        src="./images/latern.png"
        class="latern-last-decoration pendulum-swing"
      />
      <img
        src="./images/latern2.png"
        class="latern-second-last-decoration pendulum-fast"
      />
      <img
        src="./images/latern2.png"
        class="latern-second-first-decoration pendulum-slow"
      />

      <img src="./images/bt.png" class="bottom-right-decoration" />
      <img src="./images/bt.png" class="bottom-left-decoration" />
      <img src="./images/bt.png" class="bottom-center-decoration" />
      <img src="./images/bt.png" class="bottom-center-first-decoration" />

      <img
        src="./images/bt.png"
        class="flip-horizontal bottom-last-decoration"
      />
      <img
        src="./images/bt.png"
        class="flip-horizontal bottom-last-first-decoration"
      />
      <div class="main-container">
        <img src="./images/bng.png" class="bride-groom" />
        <p class="wedding-invitation-text">
          You are cordially invited to the wedding of
        </p>
        <div class="couple-names">
          <p class="bride bride-groom-text">Sayali</p>
          <p class="bride-groom-text-separator">&</p>
          <p class="groom bride-groom-text">Raj</p>
        </div>
        <br />

        <div class="event-details">
          <p class="event-date">on Thursday, 27th November 2025</p>
          <p class="event-time">at &nbsp;1:07 pm</p>
          <a
            href="https://maps.app.goo.gl/Gh8fnoKXmLPA9FNG7"
            class="venue-address"
          >
            <i class="fa fa-map-marker blink" aria-hidden="true"></i>
            Radhakrishna Mandir Hall, Dapoli
          </a>
        </div>
      </div>
      <div class="creator">
        made with ❤️ by
        <a
          href="https://instagram.com/iamshubh.n?igshid=YmMyMTA2M2Y="
          class="creator-link"
          ><i class="fa fa-instagram" aria-hidden="true"></i> iamshubh.n</a
        >
      </div>
    </section>

    <!-- Background Music -->
    <audio id="bgMusic" loop preload="auto">
      <source src="./bgmusic.mp3" type="audio/mpeg" />
    </audio>

    <!-- Background Music Script -->
    <script>
      // Set CSS custom property for viewport height
      function setViewportHeight() {
        const vh = window.innerHeight * 0.01;
        document.documentElement.style.setProperty('--vh', `${vh}px`);
      }

      // Set initial viewport height
      setViewportHeight();

      // Update viewport height on resize and orientation change
      window.addEventListener('resize', setViewportHeight);
      window.addEventListener('orientationchange', () => {
        setTimeout(setViewportHeight, 100);
      });

      document.addEventListener("DOMContentLoaded", function () {
        const audio = document.getElementById("bgMusic");
        let hasStartedPlaying = false;

        function startMusic() {
          if (!hasStartedPlaying) {
            audio.play()
              .then(() => hasStartedPlaying = true)
              .catch(() => {}); // Silent fail
          }
        }

        // Try autoplay first
        audio.play()
          .then(() => hasStartedPlaying = true)
          .catch(() => {
            // Start on user interaction if autoplay fails
            document.addEventListener("click", startMusic, { once: true });
            document.addEventListener("keydown", startMusic, { once: true });
            document.addEventListener("touchstart", startMusic, { once: true });
            document.addEventListener("mousemove", startMusic, { once: true });
          });

        // Handle audio loop
        audio.addEventListener("ended", () => {
          audio.currentTime = 0;
          audio.play();
        });
      });
    </script>
  </body>
</html>
